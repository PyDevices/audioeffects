[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipython-audioeffects"
dynamic = ["version"]
description = "Studio and guitar-pedal effects on audiodsp's audio nodes, for CPython and MicroPython"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PyDevices contributors"}]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Sound/Audio",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: MicroPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# The audiodsp floor is the newest audiodsp RELEASE that carries the commit
# AUDIODSP_PIN (repo root) names. It is not the pin: the pin is the exact
# commit the gates run against, and may sit ahead of any release.
dependencies = ["omnipython-audiodsp>=0.6.11"]

[project.urls]
Repository = "https://github.com/PyDevices/audioeffects"
Issues = "https://github.com/PyDevices/audioeffects/issues"

[tool.setuptools]
# Every package directory under lib/audioeffects, listed by hand: the
# package-dir mapping below ("." is the package) rules out packages.find,
# which would discover rebuilt/ as a top-level "rebuilt". v0.3.0 shipped
# without audioeffects.rebuilt and failed on import; tools/wheel_gate.py
# (the "Wheel" job in tests.yml) fails if a directory is left off again.
packages = ["audioeffects", "audioeffects.rebuilt"]

[tool.setuptools.package-dir]
audioeffects = "."

[tool.setuptools.dynamic]
version = {file = "VERSION"}
