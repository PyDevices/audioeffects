# The structural contract: everything that can run on a hosted runner.
#
# The tests that run a built MicroPython or CircuitPython interpreter skip
# here, because a hosted runner has none; pretending otherwise would turn a
# real gate into a skipped one. CONTRIBUTING.md says how to run them.
#
# Serially the suite takes hours, so a run is cut into shards that run side
# by side (tools/ci_shards.py): the plan job weighs the work and sizes the
# matrix so each shard has about 15 minutes of tests.
name: Tests

# Once per change: pushes to main and pull requests. Documentation-only changes
# skip it; the package README under lib/ is not skipped, because tests
# read it and the wheel carries it. So does a release pull request, which
# changes only VERSION and CHANGELOG.md, and its merge: the code it releases
# already passed here, and publish-release-packages.yml checks the release
# against that run before anything is published.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'ROADMAP.md', 'CHANGELOG.md', 'AGENTS.md', 'LICENSE', 'VERSION']
  pull_request:
    # `labeled` too: adding the `lifecycle: all classes` label re-runs the
    # pull request with the whole lifecycle matrix (see LIFECYCLE_CHANGED_FROM).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', 'README.md', 'ROADMAP.md', 'CHANGELOG.md', 'AGENTS.md', 'LICENSE', 'VERSION']
  # The full matrix on demand, for a branch that should see every Python
  # before it merges rather than after.
  workflow_dispatch:
    inputs:
      pythons:
        description: The Pythons to run on Linux, as a JSON list
        default: '["3.11", "3.12", "3.13", "3.14"]'
        type: string
      shards:
        description: Shards for each platform and Python (0 sizes them from the weights)
        default: '0'
        type: string
  # A release gate (publish-release-packages.yml): the suite at the release
  # ref, on Linux and 3.13, either whole or scoped to what changed since a
  # base.
  workflow_call:
    inputs:
      ref:
        description: The ref to test
        required: true
        type: string
      since:
        description: Run only what changed since this ref; empty runs the whole suite
        default: ''
        type: string

# A new push to a pull request cancels the run it supersedes: only the newest
# commit's result is ever read. Pushes to main are never cancelled or queued
# behind one another (each gets a group of its own), so every commit on main
# keeps its own full-matrix record.
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ inputs.since }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The lifecycle matrices (quick mode) take hours over all 45 classes and
  # 13 audiodsp nodes, so a pull request runs only what its change can move:
  # the class or node whose own code changed, and when a shared file changed
  # (the base class, the matrix, the pin) a fixed sample of each (SAMPLE in
  # tests/test_lifecycle_matrix.py, NODE_SAMPLE in tests/test_node_matrix.py).
  # A push to main runs every class and every node, and so does a manual run
  # (workflow_dispatch) or a pull request labelled `lifecycle: all classes`.
  # A release gate scoped to what changed since the last release uses that
  # release's tag as the base.
  LIFECYCLE_CHANGED_FROM: "${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'lifecycle: all classes') && format('origin/{0}', github.base_ref) || inputs.since || '' }}"
  # The base the test files are scoped against: a pull request's base
  # branch, or a release gate's `since`. Empty runs the whole suite.
  SCOPE_BASE: "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.since || '' }}"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      files: ${{ steps.scope.outputs.files }}
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      # A scoped run fetches its history, so the matrices and the scope can
      # ask git what the change touches against its base. With no base to
      # diff from, a scoped run is an error, not a run of everything.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: ${{ env.SCOPE_BASE != '' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          python: "3.13"

      # A scoped run runs only the tests its change can move: the test
      # files it edits, the tests of each effect class whose module it
      # edits, and the kit, the contract and the two lifecycle matrices,
      # which every scoped run runs. A change to shared code (the kit, the
      # base class, tests/support, the probes, the pin, this workflow) or to
      # a file with no tests of its own runs the whole suite. So do pushes to
      # main and manual runs, on every Python. tools/scoped_tests.py --ci
      # holds the mapping and prints why it chose what it chose.
      - name: Choose the tests
        id: scope
        shell: bash
        run: |
          if [[ -n "$SCOPE_BASE" ]]; then
            files=$(python tools/scoped_tests.py --ci "$SCOPE_BASE")
          else
            files=full
          fi
          if [[ "$files" == full ]]; then
            files=tests
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "running: $files"

      # What the two matrices will run, in the log where a reader can check
      # it, and a scope git cannot work out fails here by name.
      - name: Show the lifecycle scope
        shell: bash
        run: >-
          python -c "from tests.test_lifecycle_matrix import classes;
          from tests.test_node_matrix import names;
          print('base:', '${LIFECYCLE_CHANGED_FROM:-none, all}');
          print('classes:', ' '.join(classes()) or 'none');
          print('nodes:', ' '.join(names()) or 'none')"

      - name: Check the release gate's rule
        run: python tools/gate_plan.py --selftest

      # Every Python on main and on a manual run; on a pull request and at a
      # release gate only 3.13, the Python the other two platforms run. The
      # components are pure Python; the platform variance comes from
      # audiodsp's extension underneath them, so one Python is enough to
      # prove the other two platforms. A release gate runs Linux alone.
      - name: Size the shards
        id: jobs
        shell: bash
        env:
          CI_SHARDS: ${{ inputs.shards || '0' }}
          PYTHONS: >-
            ${{ (github.event_name == 'pull_request' || inputs.ref) && '["3.13"]'
            || inputs.pythons || '["3.11", "3.12", "3.13", "3.14"]' }}
          OTHERS: >-
            ${{ inputs.ref && '[]' || '["windows-latest", "macos-latest"]' }}
        run: |
          jobs=$(python tools/ci_shards.py matrix "$PYTHONS" "$OTHERS" ${{ steps.scope.outputs.files }})
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs"

  test:
    needs: plan
    name: test (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }}/${{ matrix.of }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: ${{ env.SCOPE_BASE != '' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}

      # This shard's share: its unittest classes across every core, then the
      # classes that spread their own cells, then its part of the lifecycle
      # matrices. The tests are the ones `python -m unittest discover -s
      # tests -p "test_*.py"` finds, or the scoped run's share of them. A
      # test that writes a file writes it into its own temporary directory,
      # so no two workers collide.
      - name: Run shard ${{ matrix.shard }} of ${{ matrix.of }}
        shell: bash
        run: python tools/ci_shards.py run ${{ matrix.shard }} ${{ matrix.of }} ${{ needs.plan.outputs.files }}

      - if: matrix.shard == 1
        run: python tools/validate_api.py
      - if: matrix.shard == 1
        run: python tests/parity/effects_library_smoke.py

      # What each unit cost, for `tools/ci_shards.py weights`.
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shard-times-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard }}-of-${{ matrix.of }}
          path: shard-times-*.json
          if-no-files-found: ignore

  # The job above installs lib/ editable, which serves every file on disk and
  # so cannot see a subpackage pyproject.toml leaves out -- v0.3.0 shipped an
  # audioeffects wheel without audioeffects.rebuilt and it failed on import.
  # This builds the wheel as a release does, checks every source module is
  # in them, and imports and renders from a clean venv at the audiodsp pin.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python tools/wheel_gate.py
