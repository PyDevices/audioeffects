name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

# The coordinator needs contents:write to attach release assets; a called
# workflow may not exceed the caller's grant, so the ceiling is set here.
# id-token:write is granted only to the pypi job below, the one job that
# uses it.
permissions:
  contents: write

jobs:
  # What the release has to be tested on. A final runs the whole suite at
  # the release commit. A pre-release whose code already passed the full
  # Tests matrix on main (the run is found by commit SHA and must have
  # succeeded, and nothing the suite reads may have changed since) runs only
  # what the release adds: the tests scoped to what changed since the last
  # release tag, the wheel, the API validation and the library smoke.
  # Anything tools/gate_plan.py cannot prove runs the whole suite.
  gate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      since: ${{ steps.plan.outputs.since }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Decide what the gate runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/gate_plan.py "${{ inputs.release-ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

  # The structural gates tests.yml runs, against the audiodsp pin, cut into
  # shards that run side by side: a release must not ship what CI would not
  # pass.
  gates:
    needs: gate-plan
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.release-ref || github.ref }}
      since: ${{ needs.gate-plan.outputs.since }}

  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm inherited TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [[ -z "$TESTPYPI_API_TOKEN" ]]; then
            echo "TESTPYPI_API_TOKEN is unavailable; ensure the organization secret is visible to PyDevices/audioeffects." >&2
            exit 1
          fi

  publish:
    needs:
      - gates
      - credentials
    # publishing-v15 is the publishing tag this repository's chain has used
    # since it was audiocomponents; it carries the caller-side PyPI outputs
    # (pypi-gate, pypi-publish, dist-artifact, version) the pypi job reads.
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v28
    with:
      build-kind: pure-python
      distribution-name: omnipython-audioeffects
      import-name: audioeffects
      install-dependencies: true
      working-directory: lib/audioeffects
      # MIP publishes lib/audioeffects from the tag, not the wheel, so the
      # index entry does not wait on a TestPyPI upload.
      mip-profile: audioeffects
      # Production PyPI too, for final releases. The coordinator only
      # decides; the upload is the pypi job below.
      pypi-publish: true
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  pypi:
    # The upload has to run here, in this file. PyPI matches the Trusted
    # Publisher against the workflow that runs the upload job, and when that
    # job lives in the reusable coordinator, the workflow is
    # PyDevices/.github's, not this one. The pypi environment is where the
    # maintainer's approval is required.
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.dist-artifact }}
          path: dist
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  report-pypi:
    # The coordinator's Release Health report went out before this upload,
    # with pypi "pending"; this fills in the outcome on the same row.
    needs:
      - publish
      - pypi
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    uses: PyDevices/.github/.github/workflows/reusable-report-pypi-result.yml@publishing-v28
    with:
      distribution-name: omnipython-audioeffects
      version: ${{ needs.publish.outputs.version }}
      pypi-result: ${{ needs.pypi.result }}
    secrets: inherit
