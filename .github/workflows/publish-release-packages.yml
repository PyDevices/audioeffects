name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

# The coordinator needs contents:write to attach release assets; a called
# workflow may not exceed the caller's grant, so the ceiling is set here.
# id-token:write is granted only to the pypi job below, the one job that
# uses it.
permissions:
  contents: write

jobs:
  gates:
    # The structural gates tests.yml runs, against the audiodsp pin: a release
    # must not ship what CI would not pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # AUDIODSP_PIN, not the dependency floor in pyproject.toml: the gates
      # are only attributable against a fixed core.
      - name: Resolve the audiodsp pin
        id: pin
        run: |
          tag=$(grep -v '^[[:space:]]*#' AUDIODSP_PIN | grep -v '^[[:space:]]*$' \
                | head -1 | awk '{print $1}')
          if [[ -z "$tag" ]]; then
            echo "AUDIODSP_PIN has no pin line" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "audiodsp pinned at $tag"

      # No distribution name in the requirement: the pinned commit's own
      # pyproject.toml names it, as in tests.yml.
      - name: Install audiodsp at the pin
        run: >-
          python -m pip install
          "git+https://github.com/PyDevices/audiodsp@${{ steps.pin.outputs.tag }}"

      # pytest and pytest-xdist run the suite in parallel, as tests.yml does.
      - run: python -m pip install numpy pytest pytest-xdist

      # --no-deps is load-bearing: without it a floor raised above the pinned
      # release re-resolves audiodsp from the index and every
      # measurement is taken against a core AUDIODSP_PIN does not name -- the
      # failure the pin exists to prevent, arriving through packaging. Do not
      # drop the flag.
      - run: python -m pip install --no-deps -e lib/audioeffects

      # The probe WAVs are not in git. Generate them here, so a probe that no
      # longer matches probes.json fails this step by name instead of inside
      # a test. The tests would generate them too; this makes it explicit.
      - run: python tools/effect_probes/make_probes.py --ensure

      - run: python -m pytest tests -n auto --dist loadscope -p no:cacheprovider
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - run: python tools/validate_api.py
      - run: python tests/parity/effects_library_smoke.py

  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm inherited TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [[ -z "$TESTPYPI_API_TOKEN" ]]; then
            echo "TESTPYPI_API_TOKEN is unavailable; ensure the organization secret is visible to PyDevices/audioeffects." >&2
            exit 1
          fi

  publish:
    needs:
      - gates
      - credentials
    # publishing-v15 is the publishing tag this repository's chain has used
    # since it was audiocomponents; it carries the caller-side PyPI outputs
    # (pypi-gate, pypi-publish, dist-artifact, version) the pypi job reads.
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v15
    with:
      build-kind: pure-python
      distribution-name: omnipython-audioeffects
      import-name: audioeffects
      install-dependencies: true
      working-directory: lib/audioeffects
      # MIP publishes lib/audioeffects from the tag, not the wheel, so the
      # index entry does not wait on a TestPyPI upload.
      mip-profile: audioeffects
      # Production PyPI too, for final releases. The coordinator only
      # decides; the upload is the pypi job below.
      pypi-publish: true
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  pypi:
    # The upload has to run here, in this file. PyPI matches the Trusted
    # Publisher against the workflow that runs the upload job, and when that
    # job lives in the reusable coordinator, the workflow is
    # PyDevices/.github's, not this one. The pypi environment is where the
    # maintainer's approval is required.
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.dist-artifact }}
          path: dist
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  report-pypi:
    # The coordinator's Release Health report went out before this upload,
    # with pypi "pending"; this fills in the outcome on the same row.
    needs:
      - publish
      - pypi
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    uses: PyDevices/.github/.github/workflows/reusable-report-pypi-result.yml@publishing-v15
    with:
      distribution-name: omnipython-audioeffects
      version: ${{ needs.publish.outputs.version }}
      pypi-result: ${{ needs.pypi.result }}
    secrets: inherit
